# Dogfoods the tech-debt-audit action in this repo. Runs weekly, and can be
# triggered manually (with a custom path) to test the action's features.
name: Tech debt audit

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      path:
        description: 'Directory to audit'
        required: false
        default: '.'

permissions:
  contents: read
  issues: write
  copilot-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Local reference so the workflow tests the action at the current ref,
      # including on a PR branch before it merges.
      - uses: ./tech-debt-audit
        with:
          path: ${{ github.event.inputs.path || '.' }}
